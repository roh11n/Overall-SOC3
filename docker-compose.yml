# MSSP-Overview — self-hosted stack (backend + frontend + MongoDB + Ollama).
# Run:  docker compose --env-file .env up -d --build
#
# The Ollama model (qwen2.5:1.5b by default) is pulled automatically by the
# backend on first start — no manual step needed. First pull takes a few minutes.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Port 27017 is intentionally NOT published — Mongo stays on the internal
    # docker network only. See DEPLOYMENT.md to enable auth for extra hardening.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # 11434 stays internal to the docker network.
    # For GPU acceleration, uncomment the deploy block below (needs nvidia toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-mssp_soc}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mssp-soc.io}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

  frontend:
    build:
      context: ./frontend
      args:
        # Empty => same-origin; Nginx in this container proxies /api to backend.
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  mongo_data:
  ollama_data:
